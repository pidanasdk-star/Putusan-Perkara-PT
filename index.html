<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi CRUD - Database Spreadsheet</title>
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; }
        
        /* Bagian Header Instansi & Logo */
        .app-header { text-align: center; margin-bottom: 30px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .app-header img { width: 70px; height: auto; margin-bottom: 10px; }
        .app-header h1 { font-size: 20px; margin: 5px 0; color: #333; font-weight: bold; text-transform: uppercase; }
        .app-header p { font-size: 15px; margin: 0; color: #555; font-weight: 600; }

        .card { background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; overflow: hidden; }
        .card-header { padding: 12px 20px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .bg-primary { background-color: #0d6efd; }
        .bg-secondary { background-color: #6c757d; }
        
        .card-body { padding: 20px; }
        .mb-3 { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-control { width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .search-box { width: 260px !important; padding: 6px 12px; font-size: 13px; border-radius: 4px; border: 1px solid #ced4da; }
        
        textarea.form-control { resize: vertical; height: 80px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-success { background-color: #198754; color: #fff; }
        .btn-warning { background-color: #ffc107; color: #000; }
        .btn-danger { background-color: #dc3545; color: #fff; }
        .btn-secondary { background-color: #6c757d; color: #fff; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
        .table-responsive { width: 100%; overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .table th, .table td { padding: 10px; border: 1px solid #dee2e6; text-align: left; font-size: 14px; }
        .table-striped tbody tr:nth-of-type(odd) { background-color: rgba(0,0,0,0.02); }
        .text-center { text-align: center; }
        .text-danger { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header dengan Logo dan Teks Instansi -->
        <div class="app-header">
            <!-- Ganti src="" dengan link gambar logo atau nama file logo Anda di GitHub -->
            <img src="logo MA.png" alt="Logo Mahkamah Agung" style="width: 70px; height: auto; margin-bottom: 10px;">
            <h1>Pengadilan Negeri Sidikalang</h1>
            <p>Kepaniteraan Pidana</p>
        </div>
        
        <!-- Form Input & Edit -->
        <div class="card">
            <div class="card-header bg-primary" id="form-title">Tambah Data Baru</div>
            <div class="card-body">
                <form id="crudForm">
                    <input type="hidden" id="id">
                    <div class="mb-3">
                        <label class="form-label">No Perkara</label>
                        <input type="text" class="form-control" id="no_perkara" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nama Terdakwa</label>
                        <input type="text" class="form-control" id="nama_terdakwa" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal Putusan PT</label>
                        <input type="date" class="form-control" id="tanggal_putusan_pt" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal Perubahan Putusan PT</label>
                        <input type="date" class="form-control" id="tanggal_perubahan_pt">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Keterangan</label>
                        <textarea class="form-control" id="keterangan"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success" id="save-btn">Simpan</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()" id="cancel-btn" style="display:none;">Batal</button>
                </form>
            </div>
        </div>

        <!-- Tabel Tampilan Data & Fitur Pencarian -->
        <div class="card">
            <div class="card-header bg-secondary">
                <span>Daftar Data Perkara</span>
                <input type="text" id="searchInput" class="search-box" placeholder="Cari No Perkara / Terdakwa..." onkeyup="filterData()">
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>No Perkara</th>
                                <th>Nama Terdakwa</th>
                                <th>Tanggal Putusan PT</th>
                                <th>Tanggal Perubahan Putusan PT</th>
                                <th>Keterangan</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-data">
                            <tr><td colspan="6" class="text-center">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyiN70QKr2zVtW_lcGAJ7C-qvKgocwmjYx2MHD4NKRwseIMss4ZuKcYkTGIcAppkh666Q/exec';
        let allData = [];

        function formatDate(dateString) {
            if (!dateString) return '';
            let str = dateString.toString();
            if (str.includes('T')) {
                return str.split('T')[0];
            }
            let d = new Date(dateString);
            if (!isNaN(d.getTime())) {
                let year = d.getFullYear();
                let month = String(d.getMonth() + 1).padStart(2, '0');
                let day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            return str.split(' ')[0];
        }

        document.getElementById('crudForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('id').value;
            const data = {
                action: id ? 'update' : 'create',
                id: id,
                no_perkara: document.getElementById('no_perkara').value,
                nama_terdakwa: document.getElementById('nama_terdakwa').value,
                tanggal_putusan_pt: document.getElementById('tanggal_putusan_pt').value,
                tanggal_perubahan_pt: document.getElementById('tanggal_perubahan_pt').value,
                keterangan: document.getElementById('keterangan').value
            };

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert('Data berhasil disimpan!');
                resetForm();
                loadData();
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('Terjadi kesalahan saat menyimpan data.');
            });
        });

        function loadData() {
            fetch(scriptURL + '?action=read')
            .then(response => response.json())
            .then(data => {
                allData = data || [];
                renderTable(allData);
            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.getElementById('table-data').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Gagal memuat data</td></tr>';
            });
        }

        function renderTable(data) {
            let rows = '';
            if (data.length === 0) {
                rows = '<tr><td colspan="6" class="text-center">Tidak ada data ditemukan</td></tr>';
            } else {
                data.forEach(item => {
                    let itemString = JSON.stringify(item).replace(/"/g, '&quot;');
                    let tglPutusan = formatDate(item['Tanggal Putusan PT']);
                    let tglPerubahan = formatDate(item['Tanggal Perubahan Putusan PT']);

                    rows += `<tr>
                        <td>${item['No Perkara'] || ''}</td>
                        <td>${item['Nama Terdakwa'] || ''}</td>
                        <td>${tglPutusan}</td>
                        <td>${tglPerubahan}</td>
                        <td>${item['Keterangan'] || ''}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick='editData(${itemString})'>Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteData('${item['ID']}')">Hapus</button>
                        </td>
                    </tr>`;
                });
            }
            document.getElementById('table-data').innerHTML = rows;
        }

        function filterData() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allData.filter(item => {
                let noPerkara = (item['No Perkara'] || '').toLowerCase();
                let namaTerdakwa = (item['Nama Terdakwa'] || '').toLowerCase();
                return noPerkara.includes(keyword) || namaTerdakwa.includes(keyword);
            });
            renderTable(filtered);
        }

        function editData(item) {
            document.getElementById('id').value = item['ID'] || '';
            document.getElementById('no_perkara').value = item['No Perkara'] || '';
            document.getElementById('nama_terdakwa').value = item['Nama Terdakwa'] || '';
            document.getElementById('tanggal_putusan_pt').value = formatDate(item['Tanggal Putusan PT']);
            document.getElementById('tanggal_perubahan_pt').value = formatDate(item['Tanggal Perubahan Putusan PT']);
            document.getElementById('keterangan').value = item['Keterangan'] || '';
            
            document.getElementById('form-title').innerText = 'Edit Data Perkara';
            document.getElementById('save-btn').innerText = 'Update';
            document.getElementById('save-btn').className = 'btn btn-warning';
            document.getElementById('cancel-btn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('crudForm').reset();
            document.getElementById('id').value = '';
            document.getElementById('form-title').innerText = 'Tambah Data Baru';
            document.getElementById('save-btn').innerText = 'Simpan';
            document.getElementById('save-btn').className = 'btn btn-success';
            document.getElementById('cancel-btn').style.display = 'none';
        }

        function deleteData(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data ini?')) {
                fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', id: id })
                })
                .then(response => response.json())
                .then(result => {
                    alert('Data berhasil dihapus!');
                    loadData();
                })
                .catch(error => console.error('Error deleting:', error));
            }
        }

        loadData();
    </script>
</body>
</html>
