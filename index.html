<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi CRUD - Database Spreadsheet</title>
    <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css)" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="mb-4 text-center">Manajemen Data Putusan Perkara</h2>
        
        <!-- Form Input & Edit -->
        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white" id="form-title">Tambah Data Baru</div>
            <div class="card-body">
                <form id="crudForm">
                    <input type="hidden" id="id">
                    <div class="mb-3">
                        <label class="form-label">No Perkara</label>
                        <input type="text" class="form-control" id="no_perkara" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nama Terdakwa</label>
                        <input type="text" class="form-control" id="nama_terdakwa" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal Putusan PT</label>
                        <input type="date" class="form-control" id="tanggal_putusan_pt" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal Perubahan Putusan PT</label>
                        <input type="date" class="form-control" id="tanggal_perubahan_pt">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Keterangan</label>
                        <textarea class="form-control" id="keterangan"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success" id="save-btn">Simpan</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()" id="cancel-btn" style="display:none;">Batal</button>
                </form>
            </div>
        </div>

        <!-- Tabel Tampilan Data & Fitur Pencarian -->
        <div class="card shadow">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <span>Daftar Data Perkara</span>
                <input type="text" id="searchInput" class="form-control form-control-sm w-25" placeholder="Cari No Perkara / Terdakwa..." onkeyup="filterData()">
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead>
                            <tr>
                                <th>No Perkara</th>
                                <th>Nama Terdakwa</th>
                                <th>Tanggal Putusan PT</th>
                                <th>Tanggal Perubahan Putusan PT</th>
                                <th>Keterangan</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-data">
                            <tr><td colspan="6" class="text-center">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
